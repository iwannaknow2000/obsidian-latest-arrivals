name: Release

# 打 tag（形如 1.1.0）时自动：安装依赖 → 跑测试 → 构建 →
# 把 main.js / manifest.json / styles.css 作为 Release 附件发布。
# BRAT 和 Obsidian 官方插件市场都从 Release 附件取这三个文件。

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20.x"

      - name: 校验 tag 与 manifest.json 版本一致
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "::error::tag ($TAG) 与 manifest.json 的 version ($MANIFEST_VERSION) 不一致"
            exit 1
          fi

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 构建并跑全量测试
        run: npm test

      - name: 校验产物存在
        run: |
          for f in main.js manifest.json styles.css; do
            test -s "$f" || { echo "::error::缺少产物 $f"; exit 1; }
          done

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            main.js manifest.json styles.css
