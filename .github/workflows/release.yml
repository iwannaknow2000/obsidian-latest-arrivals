name: Release

# 打 tag（形如 1.3.1）时自动：安装依赖 → 跑测试 → 构建 →
# 生成构建来源证明 → 把 main.js / manifest.json / styles.css 作为 Release 附件发布。
# BRAT、Obsidian 官方插件目录都从 Release 附件取这三个文件。

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # 生成构建来源证明（artifact attestation）需要这两个权限。
  # Obsidian 目录的自动审核会检查 "Missing GitHub artifact attestations"，
  # 开了之后用户可以用 `gh attestation verify` 密码学验证产物确实来自本仓库源码。
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20.x"

      - name: 校验 tag 与 manifest.json 版本一致
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "::error::tag ($TAG) 与 manifest.json 的 version ($MANIFEST_VERSION) 不一致"
            exit 1
          fi

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 构建并跑全量测试
        run: npm test

      - name: 校验产物存在
        run: |
          for f in main.js manifest.json styles.css; do
            test -s "$f" || { echo "::error::缺少产物 $f"; exit 1; }
          done

      # 必需放在 npm test（会重新生成 main.js）之后、发布之前
      - name: 生成构建来源证明
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            main.js manifest.json styles.css
